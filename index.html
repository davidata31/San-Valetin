<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricitos 💘</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
    font-family: 'Arial', sans-serif;
    text-align: center;
    overflow: hidden;
}

.container {
    padding: 20px;
}

h1 {
    margin-top: 40px;
    font-size: 28px;
    color: white;
}

.slider {
    width: 90%;
    max-width: 350px;
    margin: 20px auto;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.slider img {
    width: 100%;
    display: none;
}

.slider img.active {
    display: block;
}

button {
    padding: 15px 25px;
    font-size: 18px;
    margin: 10px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}

#yes {
    background-color: #28a745;
    color: white;
}

#no {
    background-color: #dc3545;
    color: white;
    position: absolute;
}

.heart {
    position: fixed;
    top: -10px;
    font-size: 20px;
    animation: fall linear infinite;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>
        Holaaaaaa Ricitos 💖<br><br>
        
        ¿Quieres ser mi San Valentín? 💘
    </h1>

    <div class="slider">
        <img src="foto1.jpg" class="active">
        <img src="foto2.jpg">
        <img src="foto3.jpg">
    </div>

    <button id="yes" onclick="sayYes()">Sí 💕</button>
    <button id="no" onmouseover="moveButton()">No 😢</button>
</div>

<script>

// SLIDER AUTOMÁTICO
let slides = document.querySelectorAll(".slider img");
let index = 0;

setInterval(() => {
    slides[index].classList.remove("active");
    index = (index + 1) % slides.length;
    slides[index].classList.add("active");
}, 2500);

// BOTÓN QUE HUYE
function moveButton() {
    let button = document.getElementById("no");
    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 50);
    button.style.left = x + "px";
    button.style.top = y + "px";
}

// CUANDO DICE SÍ
function sayYes() {
    document.body.innerHTML = `
    <div style="text-align:center; padding-top:150px;">
        <h1 style="color:white;">
        💕 Sabía que dirías que sí, Ricitos 💕<br><br>
        Te amo muchísimo❤️
        </h1>
    </div>`;
    createHearts();
}

// CORAZONES
function createHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 5000);
    }, 300);
}

createHearts();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricitos 💖</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    color: white;
}

/* Contenedor principal */
.container {
    padding: 40px 20px;
    max-width: 500px;
    margin: auto;
}

/* Imágenes */
img {
    width: 100%;
    max-width: 350px;
    border-radius: 20px;
    margin: 15px 0;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

/* Botones */
.buttons {
    margin-top: 20px;
    position: relative;
    height: 120px;
}

button {
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}

#yes {
    background: #28a745;
    color: white;
}

#no {
    background: #dc3545;
    color: white;
    position: absolute;
}

/* Corazones */
.heart {
    position: fixed;
    top: -10px;
    font-size: 20px;
    animation: fall linear infinite;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>
Holaaaa ricitos 💕<br><br>

¿Quieres ser mi San Valentín? 💖
</h1>

<img src="foto1.jpg">
<img src="foto2.jpg">
<img src="foto3.jpg">

<div class="buttons">
    <button id="yes" onclick="sayYes()">Sí 💖</button>
    <button id="no" onmouseover="moveButton()">No 😢</button>
</div>

</div>

<script>

// Botón que huye pero dentro del contenedor
function moveButton() {
    const button = document.getElementById("no");
    const parent = document.querySelector(".buttons");

    const maxX = parent.clientWidth - 100;
    const maxY = parent.clientHeight - 50;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    button.style.left = x + "px";
    button.style.top = y + "px";
}

// Cuando dice sí
function sayYes() {
    document.body.innerHTML = `
    <div style="text-align:center; padding-top:150px;">
        <h1>
        💕 Sabía que dirías que sí, Ricitos JAJAJAJAJ💕<br><br>
        Te amo muchísimo❤️
        </h1>
    </div>`;
    createHearts();
}

// Corazones cayendo
function createHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 2) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 5000);
    }, 300);
}

createHearts();

</script>

</body>
</html>
